// 应用模块: 纯 Android 框架, 不引入任何第三方依赖 —— 这样构建时只需下载 AGP 本身,
// 避免因仓库受限导致依赖解析失败。
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mulberry.detect'
    compileSdk 34

    defaultConfig {
        applicationId "com.mulberry.detect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 无需额外依赖(界面由树莓派网页提供)
}
